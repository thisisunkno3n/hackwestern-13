<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EagleEye sensor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#07090c; color:#dfe6ef; font:14px/1.4 -apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  header { padding:10px 14px; display:flex; align-items:center; gap:10px; }
  header b { font-size:15px; letter-spacing:.3px; }
  .pill { font-size:12px; padding:2px 9px; border-radius:999px; background:#1a2230; }
  .pill.on { background:#15311f; }
  .dot { width:8px; height:8px; border-radius:50%; background:#f55; display:inline-block; margin-right:5px; vertical-align:middle; }
  .dot.on { background:#3ddc84; }
  .stage { position:relative; flex:1; min-height:0; background:#000; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  canvas { pointer-events:none; }
  footer { padding:10px 14px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:#101722; border:1px solid #1d2635; border-radius:10px; padding:8px 10px; }
  .stat .k { font-size:11px; opacity:.6; } .stat .v { font-size:18px; font-weight:600; }
  .start { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .start button { font:600 16px/1 inherit; color:#07090c; background:#3ddc84; border:0;
                  padding:16px 24px; border-radius:14px; }
</style>
</head>
<body>
  <header>
    <b>EagleEye</b>
    <span class="pill" id="who">sensor</span>
    <span class="pill" id="link"><span class="dot" id="ldot"></span><span id="lstate">offline</span></span>
    <span class="pill" id="hdg" style="display:none">HDG --</span>
    <button class="pill" id="zeroBtn" style="display:none;border:0;color:#07090c;background:#ffd23d;font-weight:600">Zero heading</button>
  </header>
  <div class="stage">
    <video id="vid" playsinline muted></video>
    <canvas id="ov"></canvas>
    <div class="start" id="startWrap"><button id="startBtn">Start sensor</button></div>
  </div>
  <footer>
    <div class="stat"><div class="k">bearing</div><div class="v" id="sB">--</div></div>
    <div class="stat"><div class="k">confidence</div><div class="v" id="sC">--</div></div>
    <div class="stat"><div class="k">fps</div><div class="v" id="sF">--</div></div>
  </footer>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const qs = new URLSearchParams(location.search);
const NODE_ID   = qs.get("node") || qs.get("id") || "R1";   // Seeker node id R1/R2
const HFOV_DEG  = parseFloat(qs.get("hfov") || "66");       // horizontal FOV of the phone camera
// taped pose x_m,y_m,yaw_deg; null (not 0,0,0) when not given, so the Pi can tell "unknown" apart
const POSE = (() => { const r = qs.get("pose"); if (!r) return null;
  const a = r.split(",").map(Number); return {x_m: a[0]||0, y_m: a[1]||0, yaw_deg: a[2]||0}; })();
// live compass heading (helmet/worn phone): ?heading=1 -> send live yaw in every message
const HEADING = qs.get("heading") === "1";
let heading = null, heading0 = null;
const WS_URL    = (location.protocol === "https:" ? "wss://" : "ws://") +
                  (qs.get("host") || location.host) + "/ws";
document.getElementById("who").textContent = "node · " + NODE_ID;

const vid = document.getElementById("vid");
const ov  = document.getElementById("ov");
const ctx = ov.getContext("2d");
const el  = id => document.getElementById(id);

// ---- WebSocket link ----
let ws = null, wsReady = false;
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { wsReady = true; setLink(true);
    ws.send(JSON.stringify({ role:"sensor", node_id:NODE_ID, pose:currentPose() })); };
  ws.onclose = () => { wsReady = false; setLink(false); setTimeout(connect, 1500); };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}
function setLink(on){ el("ldot").classList.toggle("on",on); el("lstate").textContent = on?"live":"offline"; }

// ---- live compass heading (only when ?heading=1) ----
function onOrient(e) {
  if (typeof e.webkitCompassHeading === "number") heading = e.webkitCompassHeading;   // iOS, CW from magnetic N
  else if (e.absolute !== false && typeof e.alpha === "number") heading = (360 - e.alpha) % 360;
  else return;
  const y = liveYaw();
  el("hdg").textContent = "HDG " + heading.toFixed(0) + "  YAW " + (y === null ? "NOT ZEROED" : y.toFixed(0));
}
function liveYaw() {   // (-180,180], degrees clockwise from room +y; null until zeroed
  if (heading === null || heading0 === null) return null;
  return ((heading - heading0 + 540) % 360) - 180;
}
function currentPose() {   // use instead of POSE in every ws.send
  if (!HEADING) return POSE;                       // R2 / non-heading phones: unchanged
  const base = POSE || { x_m: 0, y_m: 0 };
  return { x_m: base.x_m, y_m: base.y_m, yaw_deg: liveYaw() };   // yaw_deg null until zeroed
}
async function startHeading() {   // call inside the Start click (iOS needs HTTPS + a user gesture), before getUserMedia
  if (!HEADING) return;
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    const r = await DeviceOrientationEvent.requestPermission();
    if (r !== "granted") throw new Error("compass permission denied");
  }
  if ("ondeviceorientationabsolute" in window) addEventListener("deviceorientationabsolute", onOrient);
  else addEventListener("deviceorientation", onOrient);
  el("zeroBtn").style.display = "inline-block"; el("hdg").style.display = "inline-block";
}
if (typeof document !== "undefined") el("zeroBtn").onclick = () => { if (heading !== null) heading0 = heading; };

// ---- camera + pose ----
let pose = null, raf = 0, lastT = 0, frames = 0, fpsT = 0, lastSent = 0;
// jitter control: drop weak detections, EMA-smooth bearing/range across frames
const MAX_PPL   = parseInt(qs.get("maxppl")   || "2");      // max people (set to real count to kill phantoms)
const DET_CONF  = parseFloat(qs.get("detconf") || "0.6");    // MediaPipe detection/presence/tracking threshold
const CONF_MIN  = parseFloat(qs.get("confmin") || "0.6");    // gate low-visibility (clipped/ghost) poses
const SMOOTH    = parseFloat(qs.get("smooth")  || "0.25");   // EMA weight on new frame (lower = smoother, laggier)
const MAX_STEP  = parseFloat(qs.get("maxstep") || "4");      // deg/frame slew cap (kills spikes)
const DEADBAND  = parseFloat(qs.get("deadband")|| "0.4");    // deg: ignore wiggle smaller than this
const ASSOC_DEG = 12;                                        // match a detection to last frame within this many deg
let prevSmoothed = [];
async function start() {
  el("startWrap").style.display = "none";
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width:{ideal:640}, height:{ideal:480} }, audio:false });
  vid.srcObject = stream; await vid.play();
  ov.width = vid.videoWidth || 640; ov.height = vid.videoHeight || 480;

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU" },
    runningMode: "VIDEO", numPoses: MAX_PPL,
    minPoseDetectionConfidence: DET_CONF, minPosePresenceConfidence: DET_CONF,
    minTrackingConfidence: DET_CONF });
  connect();
  loop();
}

function loop() {
  raf = requestAnimationFrame(loop);
  if (!pose || vid.readyState < 2) return;
  const now = performance.now();
  if (now === lastT) return; lastT = now;

  const res = pose.detectForVideo(vid, now);
  ctx.clearRect(0,0,ov.width,ov.height);
  frames++; if (now - fpsT > 500) { el("sF").textContent = Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now; }

  const W = ov.width, H = ov.height;
  const f = (W / 2) / Math.tan(HFOV_DEG * Math.PI / 360);   // focal length in px from FOV
  const poses = (res.landmarks && res.landmarks.length) ? res.landmarks : [];
  const raw = [];
  for (const lms of poses) {
    const cxN = (lms[23].x + lms[24].x) / 2;                // normalized hip midpoint
    const conf = Math.min(1, ((lms[23].visibility||0) + (lms[24].visibility||0)) / 2);
    if (conf < CONF_MIN) continue;                          // drop weak/clipped detections
    // pinhole bearing: atan((x - cx)/f), right of boresight positive (NOT linear in FOV)
    const bearing_deg = Math.atan((cxN * W - W / 2) / f) * 180 / Math.PI;
    // bbox from visible landmarks; null if none pass the visibility threshold
    let x0=1, y0=1, x1=0, y1=0, seen=false;
    for (const p of lms) { if ((p.visibility||0) < 0.3) continue; seen = true;
      x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
    const box = seen ? [Math.round(x0*W), Math.round(y0*H),
                        Math.round((x1-x0)*W), Math.round((y1-y0)*H)] : null;
    const range_m = (box && box[3] > 0) ? f * 1.7 / box[3] : null;
    raw.push({ bearing_deg, conf, box, range_m });
    drawPose(lms, cxN);
  }
  // temporal smoothing: match each detection to the nearest previous one in bearing, EMA-blend
  const contacts = raw.map(c => {
    let best = null, bd = ASSOC_DEG;
    for (const p of prevSmoothed) { const d = Math.abs(p.bearing_deg - c.bearing_deg); if (d < bd) { bd = d; best = p; } }
    if (best) {
      let b = SMOOTH * c.bearing_deg + (1 - SMOOTH) * best.bearing_deg;   // EMA
      if (Math.abs(b - best.bearing_deg) < DEADBAND) b = best.bearing_deg; // ignore micro-wiggle
      const step = b - best.bearing_deg;                                   // slew limit: kill spikes
      if (step >  MAX_STEP) b = best.bearing_deg + MAX_STEP;
      if (step < -MAX_STEP) b = best.bearing_deg - MAX_STEP;
      c.bearing_deg = b;
      if (c.range_m != null && best.range_m != null) c.range_m = SMOOTH * c.range_m + (1 - SMOOTH) * best.range_m;
    }
    c.bearing_deg = Math.round(c.bearing_deg * 10) / 10;
    if (c.range_m != null) c.range_m = Math.round(c.range_m * 10) / 10;
    c.conf = Math.round(c.conf * 100) / 100;
    return c;
  });
  prevSmoothed = contacts;
  if (contacts.length) { el("sB").textContent = contacts[0].bearing_deg.toFixed(1) + "deg";
                         el("sC").textContent = contacts[0].conf.toFixed(2); }
  else { el("sB").textContent = "-"; el("sC").textContent = "-"; }
  const interval = HEADING ? 66 : (contacts.length ? 66 : 200);  // >=10 Hz when sending live heading
  if (wsReady && now - lastSent > interval) {
    lastSent = now;
    ws.send(JSON.stringify({ type:"phone_detections", v:2, node_id:NODE_ID, pose:currentPose(),
                             width:W, height:H, hfov_deg:HFOV_DEG, contacts }));
  }
}

function drawPose(lms, cx) {
  const W = ov.width, H = ov.height;
  ctx.fillStyle = "#3ddc84";
  for (const p of lms) { ctx.beginPath(); ctx.arc(p.x*W, p.y*H, 4, 0, 7); ctx.fill(); }
  ctx.strokeStyle = "#ffd23d"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx*W, 0); ctx.lineTo(cx*W, H); ctx.stroke();  // bearing line
}

el("startBtn").onclick = () => startHeading().then(start).catch(e => { el("startWrap").style.display="flex";
  alert("camera/model error: " + e.message); });
</script>
</body>
</html>
