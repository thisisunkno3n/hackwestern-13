<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EagleEye sensor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#07090c; color:#dfe6ef; font:14px/1.4 -apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  header { padding:10px 14px; display:flex; align-items:center; gap:10px; }
  header b { font-size:15px; letter-spacing:.3px; }
  .pill { font-size:12px; padding:2px 9px; border-radius:999px; background:#1a2230; }
  .pill.on { background:#15311f; }
  .dot { width:8px; height:8px; border-radius:50%; background:#f55; display:inline-block; margin-right:5px; vertical-align:middle; }
  .dot.on { background:#3ddc84; }
  .stage { position:relative; flex:1; min-height:0; background:#000; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  canvas { pointer-events:none; }
  footer { padding:10px 14px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:#101722; border:1px solid #1d2635; border-radius:10px; padding:8px 10px; }
  .stat .k { font-size:11px; opacity:.6; } .stat .v { font-size:18px; font-weight:600; }
  .start { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .start button { font:600 16px/1 inherit; color:#07090c; background:#3ddc84; border:0;
                  padding:16px 24px; border-radius:14px; }
</style>
</head>
<body>
  <header>
    <b>EagleEye</b>
    <span class="pill" id="who">sensor</span>
    <span class="pill" id="link"><span class="dot" id="ldot"></span><span id="lstate">offline</span></span>
    <span class="pill" id="hdg" style="display:none">HDG --</span>
    <button class="pill" id="zeroBtn" style="display:none;border:0;color:#07090c;background:#ffd23d;font-weight:600">Zero heading</button>
    <button class="pill" id="calBtn" style="border:0;color:#07090c;background:#7fd4ff;font-weight:600">Calibrate 2 m</button>
  </header>
  <div class="stage">
    <video id="vid" playsinline muted></video>
    <canvas id="ov"></canvas>
    <div class="start" id="startWrap"><button id="startBtn">Start sensor</button></div>
  </div>
  <footer>
    <div class="stat"><div class="k">bearing</div><div class="v" id="sB">--</div></div>
    <div class="stat"><div class="k">confidence</div><div class="v" id="sC">--</div></div>
    <div class="stat"><div class="k">fps</div><div class="v" id="sF">--</div></div>
  </footer>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const qs = new URLSearchParams(location.search);
const NODE_ID   = qs.get("node") || qs.get("id") || "R1";   // Seeker node id R1/R2
const HFOV_DEG  = parseFloat(qs.get("hfov") || "66");       // horizontal FOV of the phone camera
// taped pose x_m,y_m,yaw_deg; null (not 0,0,0) when not given, so the Pi can tell "unknown" apart
const POSE = (() => { const r = qs.get("pose"); if (!r) return null;
  const a = r.split(",").map(Number); return {x_m: a[0]||0, y_m: a[1]||0, yaw_deg: a[2]||0}; })();
// live compass heading (helmet/worn phone): ?heading=1 -> send live yaw in every message
const HEADING = qs.get("heading") === "1";
let heading = null, heading0 = null;
// wearer-camera video (view node only): ?video=1 streams JPEG frames to the Pi (IF-5.6)
let videoOn = qs.get("video") === "1";
let VFPS = parseFloat(qs.get("vfps") || "15");
const VQUALITY = parseFloat(qs.get("vq") || "0.6");
let vseq = 0, capCanvas = null, capCtx = null, vtimer = null;
const WS_URL    = (location.protocol === "https:" ? "wss://" : "ws://") +
                  (qs.get("host") || location.host) + "/ws";
document.getElementById("who").textContent = "node · " + NODE_ID;

const vid = document.getElementById("vid");
const ov  = document.getElementById("ov");
const ctx = ov.getContext("2d");
const el  = id => document.getElementById(id);

// ---- WebSocket link ----
let ws = null, wsReady = false;
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { wsReady = true; setLink(true);
    ws.send(JSON.stringify({ role:"sensor", node_id:NODE_ID, pose:currentPose() })); };
  ws.onclose = () => { wsReady = false; setLink(false); setTimeout(connect, 1500); };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
  ws.onmessage = (ev) => {   // relay can turn wearer video on/off (IF-5.0 video_ctrl)
    try { const m = JSON.parse(ev.data);
      if (m.type === "video_ctrl") { videoOn = !!m.stream_video; if (m.fps) VFPS = m.fps; startVideoTimer(); }
    } catch (e) {}
  };
}
function setLink(on){ el("ldot").classList.toggle("on",on); el("lstate").textContent = on?"live":"offline"; }

// ---- live compass heading (only when ?heading=1) ----
function onOrient(e) {
  if (typeof e.webkitCompassHeading === "number") heading = e.webkitCompassHeading;   // iOS, CW from magnetic N
  else if (e.absolute !== false && typeof e.alpha === "number") heading = (360 - e.alpha) % 360;
  else return;
  const y = liveYaw();
  el("hdg").textContent = "HDG " + heading.toFixed(0) + "  YAW " + (y === null ? "NOT ZEROED" : y.toFixed(0));
}
function liveYaw() {   // (-180,180], degrees clockwise from room +y; null until zeroed
  if (heading === null || heading0 === null) return null;
  return ((heading - heading0 + 540) % 360) - 180;
}
function currentPose() {   // use instead of POSE in every ws.send
  if (!HEADING) return POSE;                       // R2 / non-heading phones: unchanged
  const base = POSE || { x_m: 0, y_m: 0 };
  return { x_m: base.x_m, y_m: base.y_m, yaw_deg: liveYaw() };   // yaw_deg null until zeroed
}
async function startHeading() {   // call inside the Start click (iOS needs HTTPS + a user gesture), before getUserMedia
  if (!HEADING) return;
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    const r = await DeviceOrientationEvent.requestPermission();
    if (r !== "granted") throw new Error("compass permission denied");
  }
  if ("ondeviceorientationabsolute" in window) addEventListener("deviceorientationabsolute", onOrient);
  else addEventListener("deviceorientation", onOrient);
  el("zeroBtn").style.display = "inline-block"; el("hdg").style.display = "inline-block";
}
if (typeof document !== "undefined") el("zeroBtn").onclick = () => { if (heading !== null) heading0 = heading; };

// ---- wearer-camera video: capture JPEG frames, send as IF-5.6 binary WS frames ----
function skv2(nodeId, tsMs, w, h, seq, jpeg) {   // 36-byte SKV2 header + JPEG (>4sBBH8sQHHII)
  const hdr = new Uint8Array(36), dv = new DataView(hdr.buffer);
  hdr.set([0x53, 0x4b, 0x56, 0x32], 0);          // "SKV2"
  dv.setUint8(4, 2); dv.setUint8(5, 0); dv.setUint16(6, 0);
  const nid = new TextEncoder().encode(nodeId);
  for (let i = 0; i < 8; i++) dv.setUint8(8 + i, i < nid.length ? nid[i] : 0);
  dv.setBigUint64(16, BigInt(tsMs)); dv.setUint16(24, w); dv.setUint16(26, h);
  dv.setUint32(28, seq >>> 0); dv.setUint32(32, jpeg.length >>> 0);
  const out = new Uint8Array(36 + jpeg.length); out.set(hdr, 0); out.set(jpeg, 36);
  return out.buffer;
}
function sendVideo() {
  if (!videoOn || !ws || ws.readyState !== 1 || !vid || vid.readyState < 2) return;
  const w = vid.videoWidth, h = vid.videoHeight; if (!w) return;
  if (!capCanvas) { capCanvas = document.createElement("canvas"); capCtx = capCanvas.getContext("2d"); }
  if (capCanvas.width !== w) { capCanvas.width = w; capCanvas.height = h; }
  capCtx.drawImage(vid, 0, 0, w, h);
  capCanvas.toBlob(b => {                         // async encode; never blocks the detection loop
    if (!b || !ws || ws.readyState !== 1) return;
    b.arrayBuffer().then(buf => { if (ws && ws.readyState === 1)
      ws.send(skv2(NODE_ID, Date.now(), w, h, vseq++, new Uint8Array(buf))); });
  }, "image/jpeg", VQUALITY);
}
function startVideoTimer() { if (videoOn && !vtimer) vtimer = setInterval(sendVideo, Math.max(33, 1000 / VFPS)); }

// ---- camera + pose ----
let pose = null, raf = 0, lastT = 0, frames = 0, fpsT = 0, lastSent = 0;
// jitter control: drop weak detections, one-euro-smooth bearing/pixel-height across frames
const MAX_PPL   = parseInt(qs.get("maxppl")   || "5");      // MediaPipe numPoses; ?maxppl=2 for the 2-person test only
const DET_CONF  = parseFloat(qs.get("detconf") || "0.6");    // MediaPipe detection/presence/tracking threshold
const CONF_MIN  = parseFloat(qs.get("confmin") || "0.6");    // gate low-visibility (clipped/ghost) poses
const ASSOC_DEG = 12;                                        // bearing match, only when a detection has no box

// ---- range from pose landmarks + one-euro smoothing ----
const HEIGHT_M       = parseFloat(qs.get("height_m") || "1.7"); // assumed standing height (m)
const CAL_M          = parseFloat(qs.get("cal_m")    || "2");   // calibration distance (m)
const VIS_MIN        = 0.5;   // landmark visibility needed for the full / torso methods
const EYE_ANKLE_FRAC = 0.90;  // eye (or nose) to mid-ankle, fraction of standing height
const TORSO_FRAC     = 0.30;  // mid-shoulder to mid-hip, fraction of standing height
const OE_ON          = qs.get("oe") !== "0";                    // ?oe=0: raw, for comparison
const OE_MIN_CUTOFF  = parseFloat(qs.get("oe_min")  || "1.0");  // Hz
const OE_BETA        = parseFloat(qs.get("oe_beta") || "0.007");
const OE_D_CUTOFF    = 1.0;   // Hz
const TRACK_DROP_S   = 0.5;   // forget a person unmatched this long
const CAL_KEY        = "seeker_f_range_" + NODE_ID;

if (qs.get("cal") === "clear") localStorage.removeItem(CAL_KEY);
let cal = (() => { try { return JSON.parse(localStorage.getItem(CAL_KEY)); } catch (e) { return null; } })();
// focal length for range: calibrated when available (scaled to this width), else from hfov
function rangeFocal(W, fFov) { return cal && cal.f_px > 0 && cal.w > 0 ? cal.f_px * W / cal.w : fFov; }

const vis = p => (p && p.visibility) || 0;
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const pxDist = (a, b, W, H) => Math.hypot((a.x - b.x) * W, (a.y - b.y) * H);

// Pixel height of the whole person, and how it was measured: { hpx, src } or null.
function personHeightPx(lms, box, W, H) {
  const ankles = [lms[27], lms[28]].filter(p => vis(p) > VIS_MIN);
  const eyes = [lms[2], lms[5]].filter(p => vis(p) > VIS_MIN);
  const top = eyes.length === 2 ? mid(eyes[0], eyes[1]) : eyes.length ? eyes[0]
            : vis(lms[0]) > VIS_MIN ? lms[0] : null;
  if (ankles.length && top) {
    const foot = ankles.length === 2 ? mid(ankles[0], ankles[1]) : ankles[0];
    const len = pxDist(top, foot, W, H);
    if (len > 10) return { hpx: len / EYE_ANKLE_FRAC, src: "full" };
  }
  const sh = [lms[11], lms[12]], hp = [lms[23], lms[24]];
  if (sh.every(p => vis(p) > VIS_MIN) && hp.every(p => vis(p) > VIS_MIN)) {
    const len = pxDist(mid(sh[0], sh[1]), mid(hp[0], hp[1]), W, H);
    if (len > 5) return { hpx: len / TORSO_FRAC, src: "torso" };
  }
  if (box && box[3] > 0) return { hpx: box[3], src: "box" };
  return null;
}

// One-euro filter (Casiez, Roussel, Vogel, CHI 2012). t in seconds.
function oeAlpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
class OneEuro {
  constructor(minCutoff = OE_MIN_CUTOFF, beta = OE_BETA, dCutoff = OE_D_CUTOFF) {
    this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
    this.x = null; this.dx = 0; this.t = null;
  }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    const a_d = oeAlpha(this.dCutoff, dt);
    this.dx = a_d * ((x - this.x) / dt) + (1 - a_d) * this.dx;
    const a = oeAlpha(this.minCutoff + this.beta * Math.abs(this.dx), dt);
    this.x = a * x + (1 - a) * this.x;
    return this.x;
  }
}

// Per-person tracks with a stable id, for N people. Match cost: box IoU first, then box center
// distance, then raw bearing when there is no box. Cheapest pairs first, each track used once.
function iou(a, b) {
  const x0 = Math.max(a[0], b[0]), y0 = Math.max(a[1], b[1]);
  const x1 = Math.min(a[0] + a[2], b[0] + b[2]), y1 = Math.min(a[1] + a[3], b[1] + b[3]);
  const inter = Math.max(0, x1 - x0) * Math.max(0, y1 - y0);
  const uni = a[2] * a[3] + b[2] * b[3] - inter;
  return uni > 0 ? inter / uni : 0;
}
function matchCost(c, tr) {
  if (c.box && tr.box) {
    const u = iou(c.box, tr.box);
    if (u > 0.1) return 1 - u;                                       // 0 .. 0.9
    const d = Math.hypot(c.box[0] + c.box[2] / 2 - tr.box[0] - tr.box[2] / 2,
                         c.box[1] + c.box[3] / 2 - tr.box[1] - tr.box[3] / 2);
    const s = Math.max(c.box[2], tr.box[2], 1);
    return d < 0.75 * s ? 1 + d / s : Infinity;                      // 1 .. 1.75
  }
  const db = Math.abs(tr.bearingRaw - c.bearing_deg);
  return db < ASSOC_DEG ? 2 + db / ASSOC_DEG : Infinity;             // 2 .. 3
}
let tracks = [], nextTrackId = 1;
function assoc(raw, t) {
  const pairs = [];
  raw.forEach((c, i) => tracks.forEach(tr => {
    const cost = matchCost(c, tr);
    if (cost < Infinity) pairs.push([cost, i, tr]);
  }));
  pairs.sort((a, b) => a[0] - b[0]);
  const match = new Array(raw.length).fill(null), taken = new Set();
  for (const [, i, tr] of pairs) if (!match[i] && !taken.has(tr)) { match[i] = tr; taken.add(tr); }
  raw.forEach((c, i) => {
    if (!match[i]) { match[i] = { id: nextTrackId++, fB: new OneEuro(), fH: new OneEuro(),
                                  hpx: null, src: null }; tracks.push(match[i]); }
    match[i].seen = t; match[i].box = c.box; match[i].bearingRaw = c.bearing_deg;
  });
  tracks = tracks.filter(tr => t - tr.seen < TRACK_DROP_S);
  return match;
}

// Calibration: one person at CAL_M, median hpx over 1.5 s.
let calib = null;
function showCal() { el("calBtn").textContent = cal ? "f " + cal.f_px.toFixed(0) + " px (" + cal.src + ")" : "Calibrate " + CAL_M + " m"; }
el("calBtn").onclick = () => { calib = { until: performance.now() + 1500, samples: [], src: null };
                               el("calBtn").textContent = "Hold still..."; };
showCal();
async function start() {
  el("startWrap").style.display = "none";
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width:{ideal:640}, height:{ideal:480} }, audio:false });
  vid.srcObject = stream; await vid.play();
  ov.width = vid.videoWidth || 640; ov.height = vid.videoHeight || 480;

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU" },
    runningMode: "VIDEO", numPoses: MAX_PPL,
    minPoseDetectionConfidence: DET_CONF, minPosePresenceConfidence: DET_CONF,
    minTrackingConfidence: DET_CONF });
  connect();
  loop();
  startVideoTimer();   // begins wearer-video capture if ?video=1 (or when video_ctrl enables it)
}

function loop() {
  raf = requestAnimationFrame(loop);
  if (!pose || vid.readyState < 2) return;
  const now = performance.now();
  if (now === lastT) return; lastT = now;

  const res = pose.detectForVideo(vid, now);
  ctx.clearRect(0,0,ov.width,ov.height);
  frames++; if (now - fpsT > 500) { el("sF").textContent = Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now; }

  const W = ov.width, H = ov.height;
  const f = (W / 2) / Math.tan(HFOV_DEG * Math.PI / 360);   // focal length in px from FOV
  const poses = (res.landmarks && res.landmarks.length) ? res.landmarks : [];
  const raw = [];
  for (const lms of poses) {
    const cxN = (lms[23].x + lms[24].x) / 2;                // normalized hip midpoint
    const conf = Math.min(1, ((lms[23].visibility||0) + (lms[24].visibility||0)) / 2);
    if (conf < CONF_MIN) continue;                          // drop weak/clipped detections
    // pinhole bearing: atan((x - cx)/f), right of boresight positive (NOT linear in FOV)
    const bearing_deg = Math.atan((cxN * W - W / 2) / f) * 180 / Math.PI;
    // bbox from visible landmarks; null if none pass the visibility threshold
    let x0=1, y0=1, x1=0, y1=0, seen=false;
    for (const p of lms) { if ((p.visibility||0) < 0.3) continue; seen = true;
      x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
    const box = seen ? [Math.round(x0*W), Math.round(y0*H),
                        Math.round((x1-x0)*W), Math.round((y1-y0)*H)] : null;
    const ph = personHeightPx(lms, box, W, H);
    raw.push({ bearing_deg, conf, box, ph });
    drawPose(lms, cxN);
  }
  // one-euro per tracked person on bearing and pixel height, then range from height
  const tS = now / 1000;
  const fR = rangeFocal(W, f);
  const match = assoc(raw, tS);
  const contacts = raw.map((c, i) => {
    const tr = match[i];
    let b = c.bearing_deg, hpx = c.ph ? c.ph.hpx : null;
    if (OE_ON) { b = tr.fB.filter(b, tS); if (hpx !== null) hpx = tr.fH.filter(hpx, tS); }
    tr.hpx = hpx; tr.src = c.ph ? c.ph.src : null;
    const range_m = hpx > 0 ? fR * HEIGHT_M / hpx : null;
    return { id: NODE_ID + "-p" + tr.id,
             bearing_deg: Math.round(b * 10) / 10,
             conf: Math.round(c.conf * 100) / 100,
             box: c.box,
             range_m: range_m === null ? null : Math.round(range_m * 100) / 100,  // 1 cm, not 10 cm
             range_src: range_m === null ? null : tr.src };
  });
  if (calib) {
    if (contacts.length === 1 && match[0].hpx > 0) { calib.samples.push(match[0].hpx); calib.src = match[0].src; }
    if (now > calib.until) {
      const s = calib.samples.sort((a, b) => a - b);
      if (s.length >= 10) {
        cal = { f_px: CAL_M * s[s.length >> 1] / HEIGHT_M, w: W, src: calib.src };
        localStorage.setItem(CAL_KEY, JSON.stringify(cal));
        showCal();
      } else el("calBtn").textContent = "Cal failed: need 1 person";
      calib = null;
    }
  }
  if (contacts.length) { el("sB").textContent = contacts[0].bearing_deg.toFixed(1) + "deg";
                         el("sC").textContent = contacts[0].conf.toFixed(2); }
  else { el("sB").textContent = "-"; el("sC").textContent = "-"; }
  const interval = HEADING ? 66 : (contacts.length ? 66 : 200);  // >=10 Hz when sending live heading
  if (wsReady && now - lastSent > interval) {
    lastSent = now;
    ws.send(JSON.stringify({ type:"phone_detections", v:2, node_id:NODE_ID, pose:currentPose(),
                             width:W, height:H, hfov_deg:HFOV_DEG, contacts }));
  }
}

function drawPose(lms, cx) {
  const W = ov.width, H = ov.height;
  ctx.fillStyle = "#3ddc84";
  for (const p of lms) { ctx.beginPath(); ctx.arc(p.x*W, p.y*H, 4, 0, 7); ctx.fill(); }
  ctx.strokeStyle = "#ffd23d"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx*W, 0); ctx.lineTo(cx*W, H); ctx.stroke();  // bearing line
}

el("startBtn").onclick = () => startHeading().then(start).catch(e => { el("startWrap").style.display="flex";
  alert("camera/model error: " + e.message); });
</script>
</body>
</html>
