<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0E0F">
<title>Firewatch sensor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- non-blocking: the page renders at once in the fallback fonts if the hotspot has no internet -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;500;600&display=swap">
<style>
  /* Firewatch drafting language: sharp plates, one 45 degree cut corner (top right), cool colours
     only (warm colours vanish in fire). Static CSS only: nothing here runs per frame, and the
     video gets no filters, so the detection loop pays nothing for the look. */
  :root {
    color-scheme: dark;
    --ground:#0D0E0F; --plate:rgba(12,13,14,.84); --line:rgba(244,242,236,.78);
    --ink:#F4F2EC; --ink2:#A7A59E; --hair:rgba(244,242,236,.2);
    --cyan:#22E4FF; --green:#3BFF9E; --mag:#FF3DD0;
    --sans:"Atkinson Hyperlegible Next", -apple-system, system-ui, sans-serif;
    --mono:"Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --sl:max(10px, env(safe-area-inset-left)); --sr:max(10px, env(safe-area-inset-right));
    --st:max(10px, env(safe-area-inset-top));  --sb:max(10px, env(safe-area-inset-bottom));
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; position:fixed; inset:0; overflow:hidden; background:var(--ground); color:var(--ink);
         font:400 14px/1.3 var(--sans); -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; }

  /* ---- plate: 1.5 px outline, top-right corner cut at 45 degrees. The border draws three sides,
     the gradient draws the diagonal (its 0 line passes through the corner at 45 degrees). ---- */
  .plate { --c:10px; --d:calc(var(--c) * .7071 - 2.12px); position:relative;
           border:1.5px solid var(--line); border-radius:0;
           background:linear-gradient(225deg, transparent var(--d), var(--line) var(--d),
                      var(--line) calc(var(--d) + 1.5px), var(--plate) calc(var(--d) + 1.5px)) padding-box;
           clip-path:polygon(0 0, calc(100% - var(--c)) 0, 100% var(--c), 100% 100%, 0 100%); }
  .plate.alert { --line:var(--mag); color:var(--ink);
                 background:repeating-linear-gradient(135deg, rgba(255,61,208,.16) 0 2px, transparent 2px 7px) padding-box,
                            linear-gradient(225deg, transparent var(--d), var(--line) var(--d),
                            var(--line) calc(var(--d) + 1.5px), var(--plate) calc(var(--d) + 1.5px)) padding-box; }

  /* ---- camera stage: full bleed ---- */
  .stage { position:absolute; inset:0; background:#000; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  canvas { pointer-events:none; }

  /* ---- HUD layer over the camera: plates hug the edges, the middle stays clear ---- */
  .hud { position:absolute; inset:0; z-index:1; pointer-events:none; display:flex; flex-direction:column;
         gap:8px; padding:var(--st) var(--sr) var(--sb) var(--sl); }
  .hud > * { pointer-events:auto; }
  .top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .chips { display:flex; flex-wrap:wrap; align-items:flex-start; gap:6px; min-width:0; flex:1; }
  .acts { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none; }
  .spacer { flex:1; pointer-events:none; }

  .brand { display:flex; align-items:center; gap:8px; min-height:40px; padding:0 20px 0 12px; white-space:nowrap; }
  .brand b { font-weight:600; font-size:16px; letter-spacing:0; }
  .brand span { color:var(--ink2); font-size:12px; }
  .chip { min-height:40px; padding:10px 18px 0 11px; font:500 13px/18px var(--mono); white-space:nowrap; }
  .chip.ok { --line:var(--cyan); color:var(--cyan); }
  .chip.bad { --line:var(--mag); color:var(--mag); }

  .btn { --c:10px; min-height:40px; padding:0 20px 0 13px; border:1.5px solid var(--line);
         font:600 14px/1 var(--sans); white-space:nowrap; text-align:left; }
  .btn:active { --plate:rgba(244,242,236,.22); }
  .btn.bad { --line:var(--mag); color:var(--mag); }

  .banner { display:none; padding:9px 18px 10px 11px; max-width:440px; }
  .banner.show { display:block; }
  .banner b { display:block; color:var(--mag); font-weight:600; font-size:14px; }
  .banner span { color:var(--ink); font-size:13px; }

  /* ---- title block: small grey key over a mono value, hairline dividers. Fixed columns
     (minmax(0,1fr)) so a changing value never resizes the grid. ---- */
  .tb { --c:12px; padding:0; overflow:hidden; }
  /* portrait columns sized for their longest values (Link "Offline", Pose "Compass") */
  .tb-grid { display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.35fr) minmax(0,1.15fr) minmax(0,1fr);
             margin:0 -1px -1px 0; }
  .cell { padding:5px 8px 6px; border-right:1px solid var(--hair); border-bottom:1px solid var(--hair); min-width:0; }
  .k { display:block; color:var(--ink2); font-size:11px; line-height:14px; }
  .v { display:block; font:500 15px/20px var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
       font-variant-numeric:tabular-nums; }
  .dot { width:8px; height:8px; background:var(--ink2); display:inline-block; margin-right:6px; vertical-align:1px; }
  .dot.on { background:var(--cyan); }
  #link.down .dot { background:var(--mag); }
  #link.down #lstate { color:var(--mag); }
  #link.up #lstate { color:var(--cyan); }

  @media (orientation:landscape) {
    .tb-grid { grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr) repeat(6, minmax(0,1fr)); }
    .tb { align-self:stretch; }
    .acts { flex-direction:row-reverse; align-items:flex-start; }
  }

  /* ---- start screen: drawing paper under a title block ---- */
  .start { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center;
           padding:var(--st) var(--sr) var(--sb) var(--sl);
           background-color:var(--ground);
           background-image:linear-gradient(rgba(244,242,236,.07) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(244,242,236,.07) 1px, transparent 1px),
                            linear-gradient(rgba(244,242,236,.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(244,242,236,.03) 1px, transparent 1px);
           background-size:120px 120px, 120px 120px, 24px 24px, 24px 24px;
           background-position:center; }
  .card { --c:16px; width:min(340px, 100%); padding:0; }
  .card-head { padding:16px 26px 14px 16px; border-bottom:1px solid var(--hair); }
  .card-head h1 { margin:0; font:600 30px/1.05 var(--sans); letter-spacing:0; }
  .card-head p { margin:4px 0 0; color:var(--ink2); font-size:14px; }
  .card .tb-grid { grid-template-columns:repeat(4, minmax(0,1fr)); }
  .card .cell:nth-child(n) { border-bottom:1px solid var(--hair); }
  .card-foot { padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; }
  .go { --c:14px; --plate:var(--ink); --line:var(--ink); width:100%; min-height:54px; padding:0 22px 0 16px;
        color:var(--ground); font:600 18px/1 var(--sans); text-align:left; }
  .go:active { --plate:#d9d6cc; --line:#d9d6cc; }
  .err { display:none; padding:9px 18px 10px 11px; font-size:13px; line-height:1.35; }
  .err.show { display:block; }
  .err b { display:block; color:var(--mag); font-size:14px; font-weight:600; margin-bottom:2px; }
  @media (orientation:landscape) and (max-height:500px) {
    .card { width:min(560px, 100%); display:grid; grid-template-columns:1fr 1fr; }
    .card-head { border-bottom:0; border-right:1px solid var(--hair); grid-row:span 2; display:flex;
                 flex-direction:column; justify-content:center; }
    .card .tb-grid { grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
</style>
</head>
<body>
  <div class="stage">
    <video id="vid" playsinline muted></video>
    <canvas id="ov"></canvas>
  </div>

  <div class="hud">
    <div class="top">
      <div class="chips">
        <div class="plate brand"><b>Firewatch</b><span>Sensor</span></div>
        <div class="plate chip" id="hdg" style="display:none">Heading --</div>
        <div class="plate chip" id="tag" style="display:none">Tag --</div>
      </div>
      <div class="acts">
        <button class="plate btn" id="calBtn">Calibrate 2 m</button>
        <button class="plate btn" id="zeroBtn" style="display:none">Zero heading</button>
      </div>
    </div>
    <div class="plate alert banner" id="conn" role="alert">
      <b>Not connected to the Pi</b><span>Check you are on the felix hotspot.</span>
    </div>
    <div class="spacer"></div>
    <div class="plate tb" id="stats">
      <div class="tb-grid">
        <div class="cell"><span class="k">Node</span><span class="v" id="who">R1</span></div>
        <div class="cell"><span class="k">Link</span><span class="v" id="link"><span class="dot" id="ldot"></span><span id="lstate">Waiting</span></span></div>
        <div class="cell"><span class="k">Fps</span><span class="v" id="sF">-</span></div>
        <div class="cell"><span class="k">Bearing</span><span class="v" id="sB">-</span></div>
        <div class="cell"><span class="k">Conf</span><span class="v" id="sC">-</span></div>
        <div class="cell"><span class="k">Range</span><span class="v" id="sR">-</span></div>
        <div class="cell"><span class="k">Pose</span><span class="v" id="sP">-</span></div>
        <div class="cell"><span class="k">Video</span><span class="v" id="sV">Off</span></div>
      </div>
    </div>
  </div>

  <div class="start" id="startWrap">
    <div class="plate card">
      <div class="card-head">
        <h1>Firewatch</h1>
        <p>Phone sensor</p>
      </div>
      <div class="tb-grid">
        <div class="cell"><span class="k">Node</span><span class="v" id="iNode">R1</span></div>
        <div class="cell"><span class="k">Video</span><span class="v" id="iVideo">Off</span></div>
        <div class="cell"><span class="k">Tag</span><span class="v" id="iTag">Off</span></div>
        <div class="cell"><span class="k">Compass</span><span class="v" id="iHdg">Off</span></div>
      </div>
      <div class="card-foot">
        <div class="plate alert err" id="startErr" role="alert"><b>Could not start</b><span id="startErrMsg"></span></div>
        <button class="plate go" id="startBtn">Start camera</button>
      </div>
    </div>
  </div>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const qs = new URLSearchParams(location.search);
const NODE_ID   = qs.get("node") || qs.get("id") || "R1";   // Seeker node id R1/R2
const HFOV_DEG  = parseFloat(qs.get("hfov") || "66");       // horizontal FOV of the phone camera
// taped pose x_m,y_m,yaw_deg; null (not 0,0,0) when not given, so the Pi can tell "unknown" apart
const POSE = (() => { const r = qs.get("pose"); if (!r) return null;
  const a = r.split(",").map(Number); return {x_m: a[0]||0, y_m: a[1]||0, yaw_deg: a[2]||0}; })();
// live compass heading (helmet/worn phone): ?heading=1 -> send live yaw in every message
const HEADING = qs.get("heading") === "1";
let heading = null, heading0 = null;
// wearer-camera video (view node only): ?video=1 streams JPEG frames to the Pi (IF-5.6)
let videoOn = qs.get("video") === "1";
let VFPS = parseFloat(qs.get("vfps") || "15");
const VQUALITY = parseFloat(qs.get("vq") || "0.6");
let vseq = 0, capCanvas = null, capCtx = null, vtimer = null;
// ---- fiducial-marker self-localization (?tag=1): the moving R1 phone detects an ArUco marker,
// treats it as the room origin, and reports THIS camera's own room pose in every message
// (through currentPose(), so no new wire contract). Default OFF -> R2 / non-tag phones unchanged.
const TAG       = qs.get("tag") === "1";
const TAG_MM    = parseFloat(qs.get("tagmm") || "186");                 // marker side length, mm (our prints)
const TAG_ID    = qs.get("tagid") != null ? parseInt(qs.get("tagid"), 10) : null;  // only this marker id
const TAG_DICT  = qs.get("tagdict") || "ARUCO_MIP_36h12";              // js-aruco2 dictionary (or "ARUCO")
const TAG_MAP   = qs.get("tagmap") || "xz";                            // 3D->floor axis map (tunable on-device)
const TAG_YAW   = parseFloat(qs.get("tagyaw") || "0");                 // additive yaw offset, deg
const TAG_HZ    = parseFloat(qs.get("taghz") || "10");                 // marker detection rate (own throttle)
const TAG_DET_W = parseInt(qs.get("tagw") || "640", 10);              // downscaled detect width, px (~2.6 m range)
const TAG_HOLD_MS = 1000;                                             // hold last good pose after marker drops
const ARUCO_URL = "https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js/+esm";
const POSIT_URL = "https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/posit1.js/+esm";
let AR = null, POS = null;                                             // loaded lazily in start(), only when TAG
let tagDetector = null, tagPosit = null, tagCanvas = null, tagCtx = null, tagTimer = null;
let tagPoseGood = null, tagPoseGoodT = -1e9;                          // last good camera pose + its performance.now()
const WS_URL    = (location.protocol === "https:" ? "wss://" : "ws://") +
                  (qs.get("host") || location.host) + "/ws";
const vid = document.getElementById("vid");
const ov  = document.getElementById("ov");
const ctx = ov.getContext("2d");
const el  = id => document.getElementById(id);
// change-only text writes with cached nodes: the per-frame stats touch the DOM only when a value
// actually changes, and the fixed title-block columns mean a change never reflows the layout.
const _node = {}, _txt = {};
function setText(id, v) {
  if (_txt[id] === v) return;
  _txt[id] = v; (_node[id] || (_node[id] = el(id))).textContent = v;
}
setText("who", NODE_ID); setText("iNode", NODE_ID);
setText("iTag", TAG ? "On" : "Off"); setText("iHdg", HEADING ? "On" : "Off");
setText("sP", TAG ? "Tag" : HEADING ? "Compass" : POSE ? "Fixed" : "Unknown");
function showVideo() { const t = videoOn ? "On" : "Off"; setText("sV", t); setText("iVideo", t); }
showVideo();

// ---- WebSocket link ----
let ws = null, wsReady = false;
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { wsReady = true; setLink(true);
    ws.send(JSON.stringify({ role:"sensor", node_id:NODE_ID, pose:currentPose() })); };
  ws.onclose = () => { wsReady = false; setLink(false); setTimeout(connect, 1500); };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
  ws.onmessage = (ev) => {   // relay can turn wearer video on/off (IF-5.0 video_ctrl)
    try { const m = JSON.parse(ev.data);
      if (m.type === "video_ctrl") { videoOn = !!m.stream_video; if (m.fps) VFPS = m.fps; startVideoTimer(); showVideo(); }
    } catch (e) {}
  };
}
// The "not connected" banner waits CONN_GRACE_MS of continuous downtime, so the 1.5 s reconnect
// retries don't make it flicker. setLink only runs after start(), never on the start screen.
const CONN_GRACE_MS = 2500;
let connTimer = 0;
function setLink(on){ el("ldot").classList.toggle("on",on); el("lstate").textContent = on?"Live":"Offline";
  el("link").classList.toggle("up", on); el("link").classList.toggle("down", !on);
  if (on) { clearTimeout(connTimer); connTimer = 0; el("conn").classList.remove("show"); }
  else if (!connTimer) connTimer = setTimeout(() => el("conn").classList.add("show"), CONN_GRACE_MS); }

// ---- live compass heading (only when ?heading=1) ----
function onOrient(e) {
  if (typeof e.webkitCompassHeading === "number") heading = e.webkitCompassHeading;   // iOS, CW from magnetic N
  else if (e.absolute !== false && typeof e.alpha === "number") heading = (360 - e.alpha) % 360;
  else return;
  const y = liveYaw();
  setText("hdg", "Heading " + heading.toFixed(0) + "°, " + (y === null ? "yaw not zeroed" : "yaw " + y.toFixed(0) + "°"));
}
function liveYaw() {   // (-180,180], degrees clockwise from room +y; null until zeroed
  if (heading === null || heading0 === null) return null;
  return ((heading - heading0 + 540) % 360) - 180;
}
function tagPoseNow() {   // live marker-derived pose, last good within TAG_HOLD_MS, else null
  if (tagPoseGood && performance.now() - tagPoseGoodT <= TAG_HOLD_MS) return tagPoseGood;
  return null;                                      // unknown -> null (IF-1), never a 0,0,0 sentinel
}
function currentPose() {   // use instead of POSE in every ws.send
  if (TAG) return tagPoseNow();                    // ?tag=1: this moving camera's own live room pose
  if (!HEADING) return POSE;                       // R2 / non-heading phones: unchanged
  const base = POSE || { x_m: 0, y_m: 0 };
  return { x_m: base.x_m, y_m: base.y_m, yaw_deg: liveYaw() };   // yaw_deg null until zeroed
}
async function startHeading() {   // call inside the Start click (iOS needs HTTPS + a user gesture), before getUserMedia
  if (!HEADING) return;
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    const r = await DeviceOrientationEvent.requestPermission();
    if (r !== "granted") throw new Error("compass permission denied");
  }
  if ("ondeviceorientationabsolute" in window) addEventListener("deviceorientationabsolute", onOrient);
  else addEventListener("deviceorientation", onOrient);
  el("zeroBtn").style.display = "inline-block"; el("hdg").style.display = "inline-block";
}
if (typeof document !== "undefined") el("zeroBtn").onclick = () => { if (heading !== null) heading0 = heading; };

// ---- wearer-camera video: capture JPEG frames, send as IF-5.6 binary WS frames ----
function skv2(nodeId, tsMs, w, h, seq, jpeg) {   // 36-byte SKV2 header + JPEG (>4sBBH8sQHHII)
  const hdr = new Uint8Array(36), dv = new DataView(hdr.buffer);
  hdr.set([0x53, 0x4b, 0x56, 0x32], 0);          // "SKV2"
  dv.setUint8(4, 2); dv.setUint8(5, 0); dv.setUint16(6, 0);
  const nid = new TextEncoder().encode(nodeId);
  for (let i = 0; i < 8; i++) dv.setUint8(8 + i, i < nid.length ? nid[i] : 0);
  dv.setBigUint64(16, BigInt(tsMs)); dv.setUint16(24, w); dv.setUint16(26, h);
  dv.setUint32(28, seq >>> 0); dv.setUint32(32, jpeg.length >>> 0);
  const out = new Uint8Array(36 + jpeg.length); out.set(hdr, 0); out.set(jpeg, 36);
  return out.buffer;
}
function sendVideo() {
  if (!videoOn || !ws || ws.readyState !== 1 || !vid || vid.readyState < 2) return;
  const w = vid.videoWidth, h = vid.videoHeight; if (!w) return;
  if (!capCanvas) { capCanvas = document.createElement("canvas"); capCtx = capCanvas.getContext("2d"); }
  if (capCanvas.width !== w) { capCanvas.width = w; capCanvas.height = h; }
  capCtx.drawImage(vid, 0, 0, w, h);
  capCanvas.toBlob(b => {                         // async encode; never blocks the detection loop
    if (!b || !ws || ws.readyState !== 1) return;
    b.arrayBuffer().then(buf => { if (ws && ws.readyState === 1)
      ws.send(skv2(NODE_ID, Date.now(), w, h, vseq++, new Uint8Array(buf))); });
  }, "image/jpeg", VQUALITY);
}
function startVideoTimer() { if (videoOn && !vtimer) vtimer = setInterval(sendVideo, Math.max(33, 1000 / VFPS)); }

// ---- fiducial-marker self-localization ---------------------------------------------------------
// Pure, unit-tested core (test_tagpose.mjs). POSIT gives the marker's pose in the CAMERA frame:
//   p_cam = R * p_marker + t,  with t = the marker CENTRE in camera coords (same units as TAG_MM, mm).
// Invert it to get THIS camera's pose in the marker (room) frame:
//   R_cam = transpose(R)  (camera->marker);   t_cam = -R_cam * t  (camera position in marker coords, mm).
// Camera forward = 3rd column of R_cam (camera +z expressed in marker coords). Project the camera
// position + forward onto the 2D room floor via a tunable axis convention (tagmap) + yaw offset
// (tagyaw), because the physical marker's mounting (wall vs floor, which way +z faces) sets the
// sign/axis, which can only be nailed down on-device. Room frame (IF-1): +y forward, +x right,
// yaw_deg clockwise from +y. Default tagmap=xz: marker +x = room right, marker +z = room forward.
function cameraPoseFromMarker(R, t, tagmap, tagyawDeg) {
  const Rc = [[R[0][0], R[1][0], R[2][0]],         // transpose(R) = camera->marker rotation
              [R[0][1], R[1][1], R[2][1]],
              [R[0][2], R[1][2], R[2][2]]];
  const tc = [-(Rc[0][0] * t[0] + Rc[0][1] * t[1] + Rc[0][2] * t[2]),   // -R_cam * t, mm
              -(Rc[1][0] * t[0] + Rc[1][1] * t[1] + Rc[1][2] * t[2]),
              -(Rc[2][0] * t[0] + Rc[2][1] * t[1] + Rc[2][2] * t[2])];
  const fwd = [Rc[0][2], Rc[1][2], Rc[2][2]];      // camera forward (+z) in marker coords
  const m = [tc[0] / 1000, tc[1] / 1000, tc[2] / 1000];                // mm -> metres
  // Each mapping: which marker axes become room (x=right, y=forward) and the floor-heading axes.
  let rx, ry, hx, hy;
  switch (tagmap) {
    case "xz":       rx =  m[0]; ry =  m[2]; hx =  fwd[0]; hy =  fwd[2]; break; // default: marker +z into room
    case "xz_rot180":rx = -m[0]; ry = -m[2]; hx = -fwd[0]; hy = -fwd[2]; break; // 180 deg rotation (NOT a mirror)
    case "xy":       rx =  m[0]; ry =  m[1]; hx =  fwd[0]; hy =  fwd[1]; break; // marker flat on floor, +y forward
    default:         rx =  m[0]; ry =  m[2]; hx =  fwd[0]; hy =  fwd[2]; break; // = xz
    // mirror maps (xz_negz/xz_negx/zx/xy_negy) removed: they reverse clockwise -> wrong side (Felix review)
  }
  let yaw = Math.atan2(hx, hy) * 180 / Math.PI + (tagyawDeg || 0);   // CW from room +y: atan2(x_comp, y_comp)
  yaw = ((yaw + 540) % 360) - 180;                 // normalize to (-180, 180]
  return { x_m: Math.round(rx * 1000) / 1000, y_m: Math.round(ry * 1000) / 1000,
           yaw_deg: Math.round(yaw * 10) / 10 };
}

// state: "ok" (cyan), "bad" (magenta) or "" (neutral); short goes in the title block's Pose cell.
function tagPill(txt, state, short) { const e = el("tag"); if (!e) return;
  if (e.style.display !== "inline-block") e.style.display = "inline-block";
  setText("tag", txt); setText("sP", short || txt);
  e.classList.toggle("on", state === "ok"); e.classList.toggle("ok", state === "ok");
  e.classList.toggle("bad", state === "bad"); }

// One detection pass: draw the live frame downscaled, find the marker, run POSIT -> camera room pose.
// Own throttle (TAG_HZ) and fully try/catch-wrapped so a bad frame or CDN hiccup never stalls or
// kills the MediaPipe rAF loop. Pill is refreshed EVERY tick (ok / hold / lost), not only on a hit.
function tagDetect() {
  if (!TAG || !tagDetector || !POS || !vid || vid.readyState < 2) return;
  try {
    const vw = vid.videoWidth, vh = vid.videoHeight; if (!vw) return;
    const dw = TAG_DET_W, dh = Math.max(1, Math.round(vh * dw / vw));
    if (!tagCanvas) { tagCanvas = document.createElement("canvas");
      tagCtx = tagCanvas.getContext("2d", { willReadFrequently: true }); }   // avoid Safari readback stall
    if (tagCanvas.width !== dw || tagCanvas.height !== dh) { tagCanvas.width = dw; tagCanvas.height = dh; }
    tagCtx.drawImage(vid, 0, 0, dw, dh);
    const markers = tagDetector.detect(tagCtx.getImageData(0, 0, dw, dh));
    let mk = null;
    for (const m of markers) { if (TAG_ID === null || m.id === TAG_ID) { mk = m; break; } }
    const now = performance.now();
    if (!mk) {                                     // no marker this frame: keep last good until it expires
      if (tagPoseGood && now - tagPoseGoodT <= TAG_HOLD_MS) tagPill("Tag hold", "", "Hold");
      else tagPill("Tag lost", "bad", "Lost");
      return;
    }
    // focal length in px AT the detection canvas width, from this node's calibrated HFOV (IF-1).
    const fpx = (dw / 2) / Math.tan(HFOV_DEG * Math.PI / 360);
    if (!tagPosit || tagPosit._f !== fpx) { tagPosit = new POS.Posit(TAG_MM, fpx); tagPosit._f = fpx; }
    // POSIT wants the 4 corners centred on the principal point with y pointing UP.
    const pts = mk.corners.map(c => ({ x: c.x - dw / 2, y: dh / 2 - c.y }));
    const p = tagPosit.pose(pts);
    const cp = cameraPoseFromMarker(p.bestRotation, p.bestTranslation, TAG_MAP, TAG_YAW);
    if (!isFinite(cp.x_m + cp.y_m + cp.yaw_deg)) return;   // POSIT NaN -> skip, don't poison the pose
    tagPoseGood = cp; tagPoseGoodT = now;
    tagPill("Tag " + mk.id + " at " + cp.x_m.toFixed(2) + ", " + cp.y_m.toFixed(2) +
            ", " + cp.yaw_deg.toFixed(0) + "°", "ok", "Tag " + mk.id);
  } catch (e) { tagPill("Tag error", "bad", "Error"); }
}
function startTagTimer() { if (TAG && !tagTimer) tagTimer = setInterval(tagDetect, Math.max(50, 1000 / TAG_HZ)); }

// ---- camera + pose ----
let pose = null, raf = 0, lastT = 0, frames = 0, fpsT = 0, lastSent = 0;
// jitter control: drop weak detections, one-euro-smooth bearing/pixel-height across frames
const MAX_PPL   = parseInt(qs.get("maxppl")   || "5");      // MediaPipe numPoses; ?maxppl=2 for the 2-person test only
const DET_CONF  = parseFloat(qs.get("detconf") || "0.6");    // MediaPipe detection/presence/tracking threshold
const CONF_MIN  = parseFloat(qs.get("confmin") || "0.6");    // gate low-visibility (clipped/ghost) poses
const ASSOC_DEG = 12;                                        // bearing match, only when a detection has no box

// ---- range from pose landmarks + one-euro smoothing ----
const HEIGHT_M       = parseFloat(qs.get("height_m") || "1.7"); // assumed standing height (m)
const CAL_M          = parseFloat(qs.get("cal_m")    || "2");   // calibration distance (m)
const VIS_MIN        = 0.5;   // landmark visibility needed for the full / torso methods
// noise gate: reject detections that aren't shaped like an upright person (clutter, bags, draped cloth)
const UPRIGHT_ON = qs.get("upright") !== "0";
const MIN_ASPECT = parseFloat(qs.get("minaspect") || "1.5");   // box height/width must exceed this (standing person is tall)
const EYE_ANKLE_FRAC = 0.90;  // eye (or nose) to mid-ankle, fraction of standing height
const TORSO_FRAC     = 0.30;  // mid-shoulder to mid-hip, fraction of standing height
const OE_ON          = qs.get("oe") !== "0";                    // ?oe=0: raw, for comparison
const OE_MIN_CUTOFF  = parseFloat(qs.get("oe_min")  || "1.0");  // Hz
const OE_BETA        = parseFloat(qs.get("oe_beta") || "0.007");
const OE_D_CUTOFF    = 1.0;   // Hz
const TRACK_DROP_S   = 0.5;   // forget a person unmatched this long
const CAL_KEY        = "seeker_f_range_" + NODE_ID;

if (qs.get("cal") === "clear") localStorage.removeItem(CAL_KEY);
let cal = (() => { try { const c = JSON.parse(localStorage.getItem(CAL_KEY));   // validate shape so a corrupt value can't brick the page
  return (c && c.f_px > 0 && c.w > 0) ? c : null; } catch (e) { return null; } })();
// focal length for range: calibrated when available (scaled to this width), else from hfov
function rangeFocal(W, fFov) { return cal && cal.f_px > 0 && cal.w > 0 ? cal.f_px * W / cal.w : fFov; }

const vis = p => (p && p.visibility) || 0;
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const pxDist = (a, b, W, H) => Math.hypot((a.x - b.x) * W, (a.y - b.y) * H);

// ---- compact skeleton landmarks (the "wallhack"): ADDITIVE to remote_contacts ----------------
// So a person only R2 sees can be redrawn on R1's HUD as a ghosted skeleton, not just a marker,
// we attach the pose landmarks we already computed to each contact as `pts`. MediaPipe's 33
// landmarks are downsampled to a COCO-17 body skeleton and FLAT-packed as integers
//   [x0,y0,v0, x1,y1,v1, ...]  (17 joints -> 51 ints)
// x,y are the image-normalized landmark (0..1) * 1000 (MediaPipe may emit <0 or >1000 for
// off-frame joints; left as-is), visibility is 0..100. Flat ints keep the datagram well under
// SEEKER_MAX_DATAGRAM (8192 B) and the C decoder's JSON token budget (MAX_TOKS 2048) even at the
// 16-contact cap, and the C fusion ignores the unknown `pts` key until Felix parses it (IF-5).
// ?skel=0 turns it off (pure {bearing,range,box} wire, for bandwidth tests).
const SKEL = qs.get("skel") !== "0";
const PTS_IDX = [0, 2, 5, 7, 8, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
//              nose Le  Re  Lear Rear Lsh Rsh Lel Rel Lwr Rwr Lhp Rhp Lkn Rkn Lank Rank
function packPts(lms) {
  const out = [];
  for (const i of PTS_IDX) {
    const p = (lms && lms[i]) || {};
    out.push(Math.round((p.x || 0) * 1000), Math.round((p.y || 0) * 1000),
             Math.round((p.visibility || 0) * 100));
  }
  return out;
}

// Pixel height of the whole person, and how it was measured: { hpx, src } or null.
// Does this pose look like an upright human? Rejects squat clutter and scrambled skeletons.
function isUpright(lms, box) {
  if (box && box[2] > 0 && box[3] / box[2] < MIN_ASPECT) return false;     // too squat for a standing person
  const noseY = vis(lms[0]) > 0.3 ? lms[0].y : null;                        // y grows downward
  const hipY  = (vis(lms[23]) > 0.3 && vis(lms[24]) > 0.3) ? (lms[23].y + lms[24].y) / 2 : null;
  const shY   = (vis(lms[11]) > 0.3 && vis(lms[12]) > 0.3) ? (lms[11].y + lms[12].y) / 2 : null;
  const anks  = [lms[27], lms[28]].filter(p => vis(p) > VIS_MIN);
  const ankY  = anks.length ? Math.max(...anks.map(p => p.y)) : null;
  if (shY  !== null && hipY !== null && !(shY  < hipY)) return false;       // shoulders above hips
  if (noseY !== null && hipY !== null && !(noseY < hipY)) return false;     // head above hips
  if (hipY !== null && ankY !== null && !(hipY < ankY)) return false;       // hips above ankles
  return true;
}
function personHeightPx(lms, box, W, H) {
  const ankles = [lms[27], lms[28]].filter(p => vis(p) > VIS_MIN);
  const eyes = [lms[2], lms[5]].filter(p => vis(p) > VIS_MIN);
  const top = eyes.length === 2 ? mid(eyes[0], eyes[1]) : eyes.length ? eyes[0]
            : vis(lms[0]) > VIS_MIN ? lms[0] : null;
  if (ankles.length && top) {
    const foot = ankles.length === 2 ? mid(ankles[0], ankles[1]) : ankles[0];
    const len = pxDist(top, foot, W, H);
    if (len > 10) return { hpx: len / EYE_ANKLE_FRAC, src: "full" };
  }
  const sh = [lms[11], lms[12]], hp = [lms[23], lms[24]];
  if (sh.every(p => vis(p) > VIS_MIN) && hp.every(p => vis(p) > VIS_MIN)) {
    const len = pxDist(mid(sh[0], sh[1]), mid(hp[0], hp[1]), W, H);
    if (len > 5) return { hpx: len / TORSO_FRAC, src: "torso" };
  }
  if (box && box[3] > 0) return { hpx: box[3], src: "box" };
  return null;
}

// One-euro filter (Casiez, Roussel, Vogel, CHI 2012). t in seconds.
function oeAlpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
class OneEuro {
  constructor(minCutoff = OE_MIN_CUTOFF, beta = OE_BETA, dCutoff = OE_D_CUTOFF) {
    this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
    this.x = null; this.dx = 0; this.t = null;
  }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    const a_d = oeAlpha(this.dCutoff, dt);
    this.dx = a_d * ((x - this.x) / dt) + (1 - a_d) * this.dx;
    const a = oeAlpha(this.minCutoff + this.beta * Math.abs(this.dx), dt);
    this.x = a * x + (1 - a) * this.x;
    return this.x;
  }
}

// Per-person tracks with a stable id, for N people. Match cost: box IoU first, then box center
// distance, then raw bearing when there is no box. Cheapest pairs first, each track used once.
function iou(a, b) {
  const x0 = Math.max(a[0], b[0]), y0 = Math.max(a[1], b[1]);
  const x1 = Math.min(a[0] + a[2], b[0] + b[2]), y1 = Math.min(a[1] + a[3], b[1] + b[3]);
  const inter = Math.max(0, x1 - x0) * Math.max(0, y1 - y0);
  const uni = a[2] * a[3] + b[2] * b[3] - inter;
  return uni > 0 ? inter / uni : 0;
}
function matchCost(c, tr) {
  if (c.box && tr.box) {
    const u = iou(c.box, tr.box);
    if (u > 0.1) return 1 - u;                                       // 0 .. 0.9
    const d = Math.hypot(c.box[0] + c.box[2] / 2 - tr.box[0] - tr.box[2] / 2,
                         c.box[1] + c.box[3] / 2 - tr.box[1] - tr.box[3] / 2);
    const s = Math.max(c.box[2], tr.box[2], 1);
    return d < 0.75 * s ? 1 + d / s : Infinity;                      // 1 .. 1.75
  }
  const db = Math.abs(tr.bearingRaw - c.bearing_deg);
  return db < ASSOC_DEG ? 2 + db / ASSOC_DEG : Infinity;             // 2 .. 3
}
let tracks = [], nextTrackId = 1;
function assoc(raw, t) {
  const pairs = [];
  raw.forEach((c, i) => tracks.forEach(tr => {
    const cost = matchCost(c, tr);
    if (cost < Infinity) pairs.push([cost, i, tr]);
  }));
  pairs.sort((a, b) => a[0] - b[0]);
  const match = new Array(raw.length).fill(null), taken = new Set();
  for (const [, i, tr] of pairs) if (!match[i] && !taken.has(tr)) { match[i] = tr; taken.add(tr); }
  raw.forEach((c, i) => {
    if (!match[i]) { match[i] = { id: nextTrackId++, fB: new OneEuro(), fH: new OneEuro(),
                                  hpx: null, src: null }; tracks.push(match[i]); }
    match[i].seen = t; match[i].box = c.box; match[i].bearingRaw = c.bearing_deg;
  });
  tracks = tracks.filter(tr => t - tr.seen < TRACK_DROP_S);
  return match;
}

// Calibration: one person at CAL_M, median hpx over 1.5 s.
let calib = null;
function showCal() { el("calBtn").classList.remove("bad");
  el("calBtn").textContent = cal ? "f " + cal.f_px.toFixed(0) + " px, " + cal.src : "Calibrate " + CAL_M + " m"; }
el("calBtn").onclick = () => { calib = { until: performance.now() + 1500, samples: [], src: null };
                               el("calBtn").classList.remove("bad"); el("calBtn").textContent = "Hold still"; };
showCal();
async function start() {
  el("startWrap").style.display = "none";
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width:{ideal:640}, height:{ideal:480} }, audio:false });
  vid.srcObject = stream; await vid.play();
  ov.width = vid.videoWidth || 640; ov.height = vid.videoHeight || 480;

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU" },
    runningMode: "VIDEO", numPoses: MAX_PPL,
    minPoseDetectionConfidence: DET_CONF, minPosePresenceConfidence: DET_CONF,
    minTrackingConfidence: DET_CONF });
  connect();
  loop();
  startVideoTimer();   // begins wearer-video capture if ?video=1 (or when video_ctrl enables it)
  if (TAG) {           // load ArUco + POSIT lazily; own try/catch so a CDN failure can't touch MediaPipe
    try {
      const arM = (await import(ARUCO_URL)).default, posM = (await import(POSIT_URL)).default;
      AR  = arM.AR  || arM;      // jsDelivr +esm default is { AR } one level down
      POS = posM.POS || posM;    // ...and { POS }
      tagDetector = new AR.Detector({ dictionaryName: TAG_DICT });
      tagPill("Tag: looking for " + TAG_DICT, "", "Looking");
      startTagTimer();
    } catch (e) { tagPill("Tag reader did not load", "bad", "No reader"); }
  }
}

function loop() {
  raf = requestAnimationFrame(loop);
  if (!pose || vid.readyState < 2) return;
  const now = performance.now();
  if (now === lastT) return; lastT = now;

  const res = pose.detectForVideo(vid, now);
  ctx.clearRect(0,0,ov.width,ov.height);
  frames++; if (now - fpsT > 500) { setText("sF", String(Math.round(frames*1000/(now-fpsT)))); frames=0; fpsT=now; }

  const W = ov.width, H = ov.height;
  const f = (W / 2) / Math.tan(HFOV_DEG * Math.PI / 360);   // focal length in px from FOV
  const poses = (res.landmarks && res.landmarks.length) ? res.landmarks : [];
  const raw = [];
  for (const lms of poses) {
    const cxN = (lms[23].x + lms[24].x) / 2;                // normalized hip midpoint
    const conf = Math.min(1, ((lms[23].visibility||0) + (lms[24].visibility||0)) / 2);
    if (conf < CONF_MIN) continue;                          // drop weak/clipped detections
    // pinhole bearing: atan((x - cx)/f), right of boresight positive (NOT linear in FOV)
    const bearing_deg = Math.atan((cxN * W - W / 2) / f) * 180 / Math.PI;
    // bbox from visible landmarks; null if none pass the visibility threshold
    let x0=1, y0=1, x1=0, y1=0, seen=false;
    for (const p of lms) { if ((p.visibility||0) < 0.3) continue; seen = true;
      x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
    const box = seen ? [Math.round(x0*W), Math.round(y0*H),
                        Math.round((x1-x0)*W), Math.round((y1-y0)*H)] : null;
    if (UPRIGHT_ON && !isUpright(lms, box)) continue;       // reject clutter / non-upright shapes
    const ph = personHeightPx(lms, box, W, H);
    raw.push({ bearing_deg, conf, box, ph, lms });   // keep lms so the contact can carry a skeleton
    drawPose(lms, cxN);
  }
  // one-euro per tracked person on bearing and pixel height, then range from height
  const tS = now / 1000;
  const fR = rangeFocal(W, f);
  const match = assoc(raw, tS);
  const contacts = raw.map((c, i) => {
    const tr = match[i];
    let b = c.bearing_deg, hpx = c.ph ? c.ph.hpx : null;
    if (OE_ON) { b = tr.fB.filter(b, tS); if (hpx !== null) hpx = tr.fH.filter(hpx, tS); }
    tr.hpx = hpx; tr.src = c.ph ? c.ph.src : null;
    const range_m = hpx > 0 ? fR * HEIGHT_M / hpx : null;
    return { id: NODE_ID + "-p" + tr.id,
             bearing_deg: Math.round(b * 10) / 10,
             conf: Math.round(c.conf * 100) / 100,
             box: c.box,
             range_m: range_m === null ? null : Math.round(range_m * 100) / 100,  // 1 cm, not 10 cm
             range_src: range_m === null ? null : tr.src,
             // ADDITIVE skeleton (the wallhack); undefined -> JSON.stringify drops it when ?skel=0
             pts: SKEL ? packPts(c.lms) : undefined };
  });
  if (calib) {
    if (contacts.length === 1 && match[0].hpx > 0) { calib.samples.push(match[0].hpx); calib.src = match[0].src; }
    if (now > calib.until) {
      const s = calib.samples.sort((a, b) => a - b);
      if (s.length >= 10) {
        cal = { f_px: CAL_M * s[s.length >> 1] / HEIGHT_M, w: W, src: calib.src };
        localStorage.setItem(CAL_KEY, JSON.stringify(cal));
        showCal();
      } else { el("calBtn").textContent = "Failed: need 1 person"; el("calBtn").classList.add("bad"); }
      calib = null;
    }
  }
  if (contacts.length) { setText("sB", contacts[0].bearing_deg.toFixed(1) + "°");
                         setText("sC", contacts[0].conf.toFixed(2));
                         setText("sR", contacts[0].range_m === null ? "-" : contacts[0].range_m.toFixed(1) + " m"); }
  else { setText("sB", "-"); setText("sC", "-"); setText("sR", "-"); }
  const interval = (HEADING || TAG) ? 66 : (contacts.length ? 66 : 200);  // >=10 Hz for live heading / moving tag pose
  if (wsReady && now - lastSent > interval) {
    lastSent = now;
    ws.send(JSON.stringify({ type:"phone_detections", v:2, node_id:NODE_ID, pose:currentPose(),
                             width:W, height:H, hfov_deg:HFOV_DEG, contacts }));
  }
}

// Seen-person cyan with a dark halo (cool colours stay visible in fire; the halo keeps them
// readable on bright frames). Batched: one path per colour instead of one fill per landmark,
// and no shadowBlur, so this is cheaper than the old per-dot fills.
const SEEN = "#22E4FF", HALO = "rgba(5,6,7,.72)";
function drawPose(lms, cx) {
  const W = ov.width, H = ov.height, x = cx * W;
  ctx.lineCap = "butt";
  ctx.strokeStyle = HALO; ctx.lineWidth = 6;                                 // bearing line halo
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  ctx.strokeStyle = SEEN; ctx.lineWidth = 2;                                 // bearing line
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  ctx.fillStyle = HALO; ctx.beginPath();                                     // landmark halos
  for (const p of lms) { ctx.moveTo(p.x*W + 6, p.y*H); ctx.arc(p.x*W, p.y*H, 6, 0, 7); }
  ctx.fill();
  ctx.fillStyle = SEEN; ctx.beginPath();                                     // landmark dots
  for (const p of lms) { ctx.moveTo(p.x*W + 3.5, p.y*H); ctx.arc(p.x*W, p.y*H, 3.5, 0, 7); }
  ctx.fill();
}

// Plain-words start errors on the start screen (magenta), in place of a blocking alert().
function startErrorText(e) {
  const msg = (e && e.message) || String(e);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return "The camera only works on the secure page. Open the https address of the Pi.";
  if (/compass permission/.test(msg))
    return "Compass access was denied. Allow motion and orientation, then tap Start camera again.";
  if (e && e.name === "NotAllowedError")
    return "Camera access was blocked. Allow the camera for this page, then tap Start camera again.";
  if (e && (e.name === "NotFoundError" || e.name === "OverconstrainedError"))
    return "No camera was found on this phone.";
  if (e && e.name === "NotReadableError")
    return "The camera is busy. Close other apps using it, then try again.";
  return "The camera or the pose model failed to load (" + msg + "). Check the connection and try again.";
}
// startHeading() stays the first call in the tap: iOS only grants the compass prompt inside the gesture.
el("startBtn").onclick = () => startHeading().then(start).catch(e => { el("startWrap").style.display="flex";
  el("startErrMsg").textContent = startErrorText(e); el("startErr").classList.add("show"); });
</script>
</body>
