<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EagleEye sensor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#07090c; color:#dfe6ef; font:14px/1.4 -apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  header { padding:10px 14px; display:flex; align-items:center; gap:10px; }
  header b { font-size:15px; letter-spacing:.3px; }
  .pill { font-size:12px; padding:2px 9px; border-radius:999px; background:#1a2230; }
  .pill.on { background:#15311f; }
  .dot { width:8px; height:8px; border-radius:50%; background:#f55; display:inline-block; margin-right:5px; vertical-align:middle; }
  .dot.on { background:#3ddc84; }
  .stage { position:relative; flex:1; min-height:0; background:#000; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  canvas { pointer-events:none; }
  footer { padding:10px 14px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:#101722; border:1px solid #1d2635; border-radius:10px; padding:8px 10px; }
  .stat .k { font-size:11px; opacity:.6; } .stat .v { font-size:18px; font-weight:600; }
  .start { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .start button { font:600 16px/1 inherit; color:#07090c; background:#3ddc84; border:0;
                  padding:16px 24px; border-radius:14px; }
</style>
</head>
<body>
  <header>
    <b>EagleEye</b>
    <span class="pill" id="who">sensor</span>
    <span class="pill" id="link"><span class="dot" id="ldot"></span><span id="lstate">offline</span></span>
  </header>
  <div class="stage">
    <video id="vid" playsinline muted></video>
    <canvas id="ov"></canvas>
    <div class="start" id="startWrap"><button id="startBtn">Start sensor</button></div>
  </div>
  <footer>
    <div class="stat"><div class="k">bearing</div><div class="v" id="sB">—</div></div>
    <div class="stat"><div class="k">confidence</div><div class="v" id="sC">—</div></div>
    <div class="stat"><div class="k">fps</div><div class="v" id="sF">—</div></div>
  </footer>

<script type="module">
import { PoseLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const qs = new URLSearchParams(location.search);
const NODE_ID   = qs.get("node") || qs.get("id") || "R1";   // Seeker node id R1/R2
const HFOV_DEG  = parseFloat(qs.get("hfov") || "66");       // horizontal FOV of the phone camera
const POSE_RAW  = (qs.get("pose") || "0,0,0").split(",").map(Number);  // taped x_m,y_m,yaw_deg
const POSE      = {x_m: POSE_RAW[0]||0, y_m: POSE_RAW[1]||0, yaw_deg: POSE_RAW[2]||0};
const WS_URL    = (location.protocol === "https:" ? "wss://" : "ws://") +
                  (qs.get("host") || location.host) + "/ws";
document.getElementById("who").textContent = "node · " + NODE_ID;

const vid = document.getElementById("vid");
const ov  = document.getElementById("ov");
const ctx = ov.getContext("2d");
const el  = id => document.getElementById(id);

// ---- WebSocket link ----
let ws = null, wsReady = false;
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { wsReady = true; setLink(true);
    ws.send(JSON.stringify({ role:"sensor", node_id:NODE_ID, pose:POSE })); };
  ws.onclose = () => { wsReady = false; setLink(false); setTimeout(connect, 1500); };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}
function setLink(on){ el("ldot").classList.toggle("on",on); el("lstate").textContent = on?"live":"offline"; }

// ---- camera + pose ----
let pose = null, raf = 0, lastT = 0, frames = 0, fpsT = 0, lastSent = 0;
async function start() {
  el("startWrap").style.display = "none";
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width:{ideal:640}, height:{ideal:480} }, audio:false });
  vid.srcObject = stream; await vid.play();
  ov.width = vid.videoWidth || 640; ov.height = vid.videoHeight || 480;

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU" },
    runningMode: "VIDEO", numPoses: 1 });
  connect();
  loop();
}

function loop() {
  raf = requestAnimationFrame(loop);
  if (!pose || vid.readyState < 2) return;
  const now = performance.now();
  if (now === lastT) return; lastT = now;

  const res = pose.detectForVideo(vid, now);
  ctx.clearRect(0,0,ov.width,ov.height);
  frames++; if (now - fpsT > 500) { el("sF").textContent = Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now; }

  const lms = res.landmarks && res.landmarks[0];
  if (lms) {
    const W = ov.width, H = ov.height;
    // horizontal centre = midpoint of hips (23,24)
    const cx = (lms[23].x + lms[24].x) / 2;
    const conf = Math.min(1, ((lms[23].visibility||0) + (lms[24].visibility||0)) / 2);
    const bearing_deg = (cx - 0.5) * HFOV_DEG;             // left -, right + (clockwise from boresight)
    // bounding box (pixels) from visible landmarks
    let x0=1,y0=1,x1=0,y1=0;
    for (const p of lms){ if((p.visibility||0)<0.3) continue;
      x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
    const box = [Math.round(x0*W), Math.round(y0*H), Math.round((x1-x0)*W), Math.round((y1-y0)*H)];
    const f = (W/2)/Math.tan(HFOV_DEG*Math.PI/360);
    const range_m = box[3]>0 ? Math.round(f*1.7/box[3]*10)/10 : null;   // mono, assume 1.7 m
    drawPose(lms, cx);
    el("sB").textContent = bearing_deg.toFixed(1) + "°";
    el("sC").textContent = conf.toFixed(2);
    if (wsReady && now - lastSent > 66) {   // ~15 Hz
      lastSent = now;
      ws.send(JSON.stringify({ node_id:NODE_ID, bearing_deg, conf, box, range_m }));
    }
  } else {
    el("sB").textContent = "—"; el("sC").textContent = "—";
    if (wsReady && now - lastSent > 200) {   // liveness: empty contacts keep the node alive
      lastSent = now; ws.send(JSON.stringify({ node_id:NODE_ID, contacts: [] }));
    }
  }
}

function drawPose(lms, cx) {
  const W = ov.width, H = ov.height;
  ctx.fillStyle = "#3ddc84";
  for (const p of lms) { ctx.beginPath(); ctx.arc(p.x*W, p.y*H, 4, 0, 7); ctx.fill(); }
  ctx.strokeStyle = "#ffd23d"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx*W, 0); ctx.lineTo(cx*W, H); ctx.stroke();  // bearing line
}

el("startBtn").onclick = () => start().catch(e => { el("startWrap").style.display="flex";
  alert("camera/model error: " + e.message); });
</script>
</body>
</html>
